name: Diff Breakdown

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diff-breakdown-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  breakdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: szijpeter/diff-breakdown@bc613f9011374a65acc55202084142bce3e3cf6a # v0.1.0
        with:
          token: ${{ github.token }}
