name: Diff Breakdown

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diff-breakdown-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  breakdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: szijpeter/diff-breakdown@d42c30f746cd204404b321fbae10693d82cd3ce7 # v0.2.0
        with:
          token: ${{ github.token }}
